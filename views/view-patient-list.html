<div id="patient-list-view" class="fade-in" style="display: none;">

                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">

                    <div class="border-b border-gray-200 px-4 pt-4 bg-gray-50/50">

                        <ul class="nav nav-tabs -mb-px" id="patientListTabs" role="tablist">

                            <li class="nav-item" role="presentation">

                                <button class="nav-link active font-bold text-teal-700" id="active-tab" data-bs-toggle="tab" data-bs-target="#active-patients" type="button" role="tab" onclick="switchPatientTab('Active')">

                                    <i class="bi bi-person-check-fill mr-2"></i>ทะเบียนให้บริการ

                                </button>

                            </li>

                            <li class="nav-item" role="presentation">

                                <button class="nav-link text-gray-500 hover:text-gray-700" id="discharged-tab" data-bs-toggle="tab" data-bs-target="#discharged-patients" type="button" role="tab" onclick="switchPatientTab('Discharged')">

                                    <i class="bi bi-person-x-fill mr-2"></i>ผู้ป่วยที่ปิดบริการ

                                </button>

                            </li>

                        </ul>

                    </div>



                    <div class="p-4 border-b border-gray-100 flex flex-col md:flex-row gap-4 justify-between items-center">

                        <div class="relative w-full md:w-96">

                             <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">

                                <i class="bi bi-search text-gray-400"></i>

                            </div>

                            <input type="text" id="searchInput" onkeyup="filterPatients()" placeholder="ค้นหาชื่อ, CN, เลขบัตร..." class="pl-10 w-full rounded-lg border-gray-300 focus:ring-teal-500 focus:border-teal-500 text-sm">

                        </div>

                        <div class="flex gap-2 w-full md:w-auto">

                            <select id="zoneFilter" onchange="filterPatients()" class="rounded-lg border-gray-300 text-sm focus:ring-teal-500 focus:border-teal-500 min-w-[140px]"></select>

                            <button id="btn-new-patient" onclick="openNewPatientForm()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center transition shadow-sm whitespace-nowrap">

                                <i class="bi bi-person-plus-fill mr-2"></i> ผู้ป่วยใหม่

                            </button>

                        </div>

                    </div>



                    <div class="overflow-x-auto">

                        <table class="w-full text-sm text-left">

                            <thead class="bg-gray-50 text-gray-500 uppercase font-medium">

                                <tr id="patient-table-header"></tr>

                            </thead>

                            <tbody id="patient-table-body" class="divide-y divide-gray-100"></tbody>

                        </table>

                    </div>

                </div>

            </div>
