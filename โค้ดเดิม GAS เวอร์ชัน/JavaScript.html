function populateOpdForm(record) {
    const form = document.getElementById('opd-form');
    // 1. เติมข้อมูลในช่อง Input, Textarea, Select ทั่วไป
    for (const key in record) {
        const el = form.querySelector(`[name="${key}"]`);
        if (el) {
            if (el.type === 'date' && record[key]) {
                // --- START: แก้ไขเรื่อง Timezone ---
                const date = new Date(record[key]);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                el.value = `${year}-${month}-${day}`;
                // --- END: สิ้นสุดการแก้ไข ---
            } else if (el.type === 'checkbox') {
                el.checked = record[key] === true || record[key] === 'true' || record[key] === 'TRUE' || record[key] === 1 || record[key] === '1' || record[key] === 'on';
            } else if (el.type === 'radio') {
                const radioEl = form.querySelector(`input[name="${key}"][value="${record[key]}"]`);
                if(radioEl) radioEl.checked = true;
            }
            else el.value = record[key];
        }
    }

    // จัดการเวลาให้ถูกต้อง
    const formatTime = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };
    form.querySelector('[name="StartTime"]').value = formatTime(record.StartTime);
    form.querySelector('[name="EndTime"]').value = formatTime(record.EndTime);
    applyServiceTypeSelection(form, record);

    // 2. เติมข้อมูลใน Checkbox Groups
    populateCheckboxGroup('opd-diagnosis-container', 'Diagnosis', record.Diagnosis);
    populateCheckboxGroup('opd-ud-container', 'UD', record.UD);
    populateCheckboxGroup('opd-problemlist-container', 'ProblemList', record.ProblemList);
    populateCheckboxGroup('opd-goals-container', 'GoalsOfTreatment', record.GoalsOfTreatment);
    populateCheckboxGroup('opd-plan-container', 'PlanOfTreatment', record.PlanOfTreatment);
    
    // 3. จัดการ Fx.HIP Status
    if(record.FxHIP_Status) {
        const fxhipRadio = form.querySelector(`input[name="FxHIP_Status"][value="${record.FxHIP_Status}"]`);
        if (fxhipRadio) {
            fxhipRadio.checked = true;
            if(record.FxHIP_Status === 'PWB') {
                document.getElementById('fxhip_pwb_details').style.display = 'inline-flex';
                form.querySelector(`input[name="FxHIP_PWB_Percent"]`).value = record.FxHIP_PWB_Percent || '';
            }
        }
    }
    
    // 4. เติมข้อมูล Physical Exam และ Treatment ที่ซับซ้อน
    populatePhysicalExamForm(record);
    populateTreatmentForm(record.Treatment_Details);
}

function populatePhysicalExamForm(record) {
    const form = document.getElementById('opd-form');
    if (record.LevelOfConsciousness) {
        const locs = record.LevelOfConsciousness.split(', ');
        locs.forEach(val => {
            const cb = form.querySelector(`input[name="PE_LOC"][value="${val}"]`);
            if (cb) cb.checked = true;
        });
    }
    const communicationAphasiaDetails = document.getElementById('communication_aphasia_details');
    if (communicationAphasiaDetails) communicationAphasiaDetails.style.display = record.Communication === 'Aphasia' ? 'block' : 'none';
    const equipmentValues = String(record.Equipment || '').split(', ').filter(Boolean);
    equipmentValues.forEach(val => {
        const cb = form.querySelector(`input[name="EquipmentOption"][value="${val}"]`);
        if (cb) cb.checked = true;
    });
    const equipmentOtherDetails = document.getElementById('equipment_other_details');
    if (equipmentOtherDetails) equipmentOtherDetails.style.display = equipmentValues.includes('Other') ? 'block' : 'none';

    const saValues = String(record.SpecialAssessment || '').split(', ').filter(Boolean);
    saValues.forEach(val => {
        const cb = form.querySelector(`input[name="SpecialAssessmentOption"][value="${val}"]`);
        if (cb) cb.checked = true;
    });
    if (form.querySelector('[name="SpecialAssessment_Details"]')) {
        form.querySelector('[name="SpecialAssessment_Details"]').value = record.SpecialAssessment_Details || '';
    }
    if (form.querySelector('[name="SpecialAssessment_ASIA_NLI"]')) {
        form.querySelector('[name="SpecialAssessment_ASIA_NLI"]').value = record.SpecialAssessment_ASIA_NLI || '';
    }
    if (form.querySelector('[name="SpecialAssessment_ASIA_AIS"]')) {
        form.querySelector('[name="SpecialAssessment_ASIA_AIS"]').value = record.SpecialAssessment_ASIA_AIS || '';
    }
    if (form.querySelector('[name="SpecialAssessment_ASIA_Diagnosis"]')) {
        form.querySelector('[name="SpecialAssessment_ASIA_Diagnosis"]').value = record.SpecialAssessment_ASIA_Diagnosis || '';
    }
    toggleSpecialAssessmentDetails();

    // Restore PE section checkboxes and show their panels
    form.querySelectorAll('input[name^="PE_"]').forEach(cb => {
        if (record[cb.name]) {
            cb.checked = true;
            const detailDiv = document.getElementById(cb.id.replace('check', 'details'));
            if (detailDiv) detailDiv.style.display = 'block';
        }
    });

    // Geolocation display
    if (record.GeoLocationTimestamp) {
        const geoDisplay = document.getElementById('geoLocationDisplay');
        if (geoDisplay) geoDisplay.value = record.GeoLocationTimestamp;
        const geoLat = document.getElementById('geoLatInput');
        if (geoLat) geoLat.value = record.GeoLatitude || '';
        const geoLng = document.getElementById('geoLngInput');
        if (geoLng) geoLng.value = record.GeoLongitude || '';
        const geoAddr = document.getElementById('geoAddressInput');
        if (geoAddr) geoAddr.value = record.GeoAddress || '';
        const geoTs = document.getElementById('geoTimestampInput');
        if (geoTs) geoTs.value = record.GeoTimestamp || '';
    }

    try {
        // Gross Motor Function
        const gm = JSON.parse(record.GrossMotorFunction || '{}');
        for (const key in gm) {
            if (gm[key]) {
                const radio = form.querySelector(`input[name="GM_${key}"][value="${gm[key]}"]`);
                if (radio) radio.checked = true;
            }
        }

        // Hand Function
        const hf = JSON.parse(record.HandFunction || '{}');
        for (const key in hf) {
            if (hf[key]) {
                const radio = form.querySelector(`input[name="HF_${key}"][value="${hf[key]}"]`);
                if (radio) radio.checked = true;
            }
        }
        const hfRt = form.querySelector('[name="HF_Side_Rt"]');
        if (hfRt) hfRt.checked = record.HF_Side_Rt === true || record.HF_Side_Rt === 'true' || record.HF_Side_Rt === 'on';
        const hfLt = form.querySelector('[name="HF_Side_Lt"]');
        if (hfLt) hfLt.checked = record.HF_Side_Lt === true || record.HF_Side_Lt === 'true' || record.HF_Side_Lt === 'on';

        // Balance Grid
        const bal = JSON.parse(record.BalanceGrid || record.Balance || '{}');
        ['SitStatic', 'SitDynamic', 'StandStatic', 'StandDynamic'].forEach(key => {
            if (bal[key]) {
                const radio = form.querySelector(`input[name="Bal_${key}"][value="${bal[key]}"]`);
                if (radio) radio.checked = true;
            }
        });

        // Gait Analysis
        const gaitDetails = JSON.parse(record.GaitAnalysis_Details || '{}');
        for (const p in gaitDetails) {
            const cb = form.querySelector(`input[name="GaitAnalysis_Phase"][value="${p}"]`);
            if (cb) cb.checked = true;
            const sel = form.querySelector(`select[name="GaitAnalysis_Grade_${p.replace(/\s+/g, '')}"]`);
            if (sel) sel.value = gaitDetails[p];
        }

        // Quality of Movement
        const qm = JSON.parse(record.QualityMovement || '{}');
        for (const l in qm) {
            for (const s in qm[l]) {
                const sel = form.querySelector(`[name="QM_${l}_${s}"]`);
                if (sel) sel.value = qm[l][s];
            }
        }

        // Joint / Sensation
        const jUE = JSON.parse(record.JointSensation_UE_Details || '{}');
        for (const k in jUE) { const sel = form.querySelector(`[name="${k.replace(/\s+/g, '_')}_UE"]`); if(sel) sel.value = jUE[k]; }
        const jLE = JSON.parse(record.JointSensation_LE_Details || '{}');
        for (const k in jLE) { const sel = form.querySelector(`[name="${k.replace(/\s+/g, '_')}_LE"]`); if(sel) sel.value = jLE[k]; }

        ['PROM', 'Length', 'Tone'].forEach(cat => populateCheckboxGroupWithDetails('opd-form', cat, record[cat]));
    } catch(e) { console.error("Error parsing PE JSON:", e); }
}

function populateTreatmentForm(jsonString) {
    try {
        const formData = JSON.parse(jsonString || '{}');
        for (const treatId in formData) {
            const check = document.getElementById(`treat_check_${treatId}`);
            if (check) check.checked = true;
            const timeSelect = document.querySelector(`[name="Treatment_Time_${treatId}"]`);
            if (timeSelect) timeSelect.value = formData[treatId].time;

            if (formData[treatId].details) {
                const savedDetails = formData[treatId].details;

                savedDetails.forEach(val => {
                    const detailCheck = document.querySelector(`input[name="Treatment_Detail_${treatId}"][value="${val}"]`);
                    if (detailCheck) {
                        // This is a predefined checkbox
                        detailCheck.checked = true;
                    } else if (treatId === 'Other') {
                        // This must be the custom text
                        const otherCheckbox = document.querySelector('input[name="Treatment_Detail_Other_Checkbox"]');
                        const otherTextInput = document.querySelector('input[name="Treatment_Detail_Other_Custom"]');
                        if (otherCheckbox) otherCheckbox.checked = true;
                        if (otherTextInput) otherTextInput.value = val;
                    }
                });
            }
        }
    } catch (e) {
        console.error("Error parsing Treatment JSON:", e);
    }
}

function getPhysicalExamData() {
    const data = {};
    const form = document.getElementById('opd-form');
    const locValues = Array.from(form.querySelectorAll('input[name="PE_LOC"]:checked')).map(cb => cb.value);
    data.LevelOfConsciousness = locValues.join(', ');
    data.Communication = (form.querySelector('input[name="Communication"]:checked') || {}).value || '';
    data.CommunicationAphasiaType = data.Communication === 'Aphasia' ? ((form.querySelector('input[name="CommunicationAphasiaType"]:checked') || {}).value || '') : '';
    const equipmentValues = Array.from(form.querySelectorAll('input[name="EquipmentOption"]:checked')).map(cb => cb.value);
    data.Equipment = equipmentValues.join(', ');
    const equipOtherEl = form.querySelector('[name="EquipmentOther"]');
    data.EquipmentOther = (equipmentValues.includes('Other') && equipOtherEl) ? (equipOtherEl.value || '').trim() : '';
    
    const saValues = Array.from(form.querySelectorAll('input[name="SpecialAssessmentOption"]:checked')).map(cb => cb.value);
    data.SpecialAssessment = saValues.join(', ');
    data.SpecialAssessment_Details = form.querySelector('[name="SpecialAssessment_Details"]')?.value.trim() || '';
    data.SpecialAssessment_ASIA_NLI = form.querySelector('[name="SpecialAssessment_ASIA_NLI"]')?.value.trim() || '';
    data.SpecialAssessment_ASIA_AIS = form.querySelector('[name="SpecialAssessment_ASIA_AIS"]')?.value.trim() || '';
    data.SpecialAssessment_ASIA_Diagnosis = form.querySelector('[name="SpecialAssessment_ASIA_Diagnosis"]')?.value.trim() || '';
    form.querySelectorAll('input[name^="PE_"]').forEach(cb => data[cb.name] = cb.checked);

    // Gross Motor Function (new grid - radio buttons)
    const gmFunctionKeys = ['MoveUp', 'MoveDown', 'MoveRight', 'MoveLeft', 'SubSideLying', 'SideLyingSit', 'SitStand'];
    const gmData = {};
    gmFunctionKeys.forEach(key => {
        const checked = form.querySelector(`input[name="GM_${key}"]:checked`);
        gmData[key] = checked ? checked.value : '';
    });
    data.GrossMotorFunction = JSON.stringify(gmData);

    // Hand Function (new grid - radio buttons)
    const hfFunctionKeys = ['Reaching', 'GraspRelease', 'PassObj', 'ThumbOpp', 'PinchGrasp'];
    const hfData = {};
    hfFunctionKeys.forEach(key => {
        const checked = form.querySelector(`input[name="HF_${key}"]:checked`);
        hfData[key] = checked ? checked.value : '';
    });
    data.HandFunction = JSON.stringify(hfData);
    data.HF_Side_Rt = form.querySelector('[name="HF_Side_Rt"]')?.checked || false;
    data.HF_Side_Lt = form.querySelector('[name="HF_Side_Lt"]')?.checked || false;

    // Balance Grid (new)
    const balKeys = ['SitStatic', 'SitDynamic', 'StandStatic', 'StandDynamic'];
    const balData = {};
    balKeys.forEach(key => {
        const checked = form.querySelector(`input[name="Bal_${key}"]:checked`);
        balData[key] = checked ? checked.value : '';
    });
    data.BalanceGrid = JSON.stringify(balData);
    // Legacy Balance field for backward compatibility
    data.Balance = JSON.stringify({ Sitting: balData.SitStatic || '', Standing: balData.StandStatic || '' });

    // Gait Analysis
    const gait = {};
    form.querySelectorAll('input[name="GaitAnalysis_Phase"]:checked').forEach(cb => {
        const p = cb.value;
        const sel = form.querySelector(`select[name="GaitAnalysis_Grade_${p.replace(/\s+/g, '')}"]`);
        gait[p] = sel ? sel.value : 'N/A';

    data.GaitAnalysis_Details = JSON.stringify(gait);

    const qmUErt = form.querySelector('[name="QM_UE_Rt"]');
    const qmUElt = form.querySelector('[name="QM_UE_Lt"]');
    const qmLErt = form.querySelector('[name="QM_LE_Rt"]');
    const qmLElt = form.querySelector('[name="QM_LE_Lt"]');
    data.QualityMovement = JSON.stringify({
        UE: { Rt: qmUErt ? qmUErt.value : '', Lt: qmUElt ? qmUElt.value : '' },
        LE: { Rt: qmLErt ? qmLErt.value : '', Lt: qmLElt ? qmLElt.value : '' }
    });

    const getJointSafe = (name) => { const el = form.querySelector(`[name="${name}"]`); return el ? el.value : ''; };
    data.JointSensation_UE_Details = JSON.stringify({
        'Rt. Joint': getJointSafe('Joint_UE_Rt'), 'Rt. Sensation': getJointSafe('Sensation_UE_Rt'),
        'Lt. Joint': getJointSafe('Joint_UE_Lt'), 'Lt. Sensation': getJointSafe('Sensation_UE_Lt')
    });
    data.JointSensation_LE_Details = JSON.stringify({
        'Rt. Joint': getJointSafe('Joint_LE_Rt'), 'Rt. Sensation': getJointSafe('Sensation_LE_Rt'),
        'Lt. Joint': getJointSafe('Joint_LE_Lt'), 'Lt. Sensation': getJointSafe('Sensation_LE_Lt')
    });

    data.PROM = getCheckboxGroupDataWithDetails('opd-form', 'PROM');
    data.Length = getCheckboxGroupDataWithDetails('opd-form', 'Length');
    data.Tone = getCheckboxGroupDataWithDetails('opd-form', 'Tone');
    
    return data;
}

function getTreatmentData(formId) {
    const form = document.getElementById(formId);
    if (!form) return '{}'; // ถ้าไม่พบฟอร์ม ให้ส่ง JSON ว่างกลับ

    const data = {};
    // ค้นหาเฉพาะภายในฟอร์มที่ระบุ
    form.querySelectorAll('input[name="Treatment_Check"]:checked').forEach(cb => {
        const id = cb.value;
        
        // ค้นหา details เฉพาะภายในฟอร์ม
        let details = Array.from(form.querySelectorAll(`input[name="Treatment_Detail_${id}"]:checked`)).map(d => d.value);

        // จัดการ "อื่นๆ" (Other) เฉพาะภายในฟอร์ม
        if (id === 'Other') {
            const otherCheckbox = form.querySelector('input[name="Treatment_Detail_Other_Checkbox"]');
            const otherTextInput = form.querySelector('input[name="Treatment_Detail_Other_Custom"]');

            if (otherCheckbox && otherCheckbox.checked && otherTextInput && otherTextInput.value.trim() !== '') {
                details.push(otherTextInput.value.trim());
            }
        }
        
        // ค้นหาเวลา เฉพาะภายในฟอร์ม
        const time = form.querySelector(`[name="Treatment_Time_${id}"]`).value;
        data[id] = { time, details };
    });
    return JSON.stringify(data);
}

function calculateTotalTreatmentTime() {
    // ค้นหาฟอร์มที่กำลังแสดงอยู่ (OPD หรือ SOAP)
    const form = document.getElementById('opd-form') || document.getElementById('soap-note-form');
    if (!form) return 0;

    let total = 0;
    // ค้นหาเฉพาะภายในฟอร์มที่ระบุ
    form.querySelectorAll('input[name="Treatment_Check"]:checked').forEach(cb => {
        const time = parseInt(form.querySelector(`[name="Treatment_Time_${cb.value}"]`).value || '0');
        total += time;
    });
    return total;
}

signaturePads.soapTherapist.toDataURL() : '',

signaturePads.soapPatient.toDataURL() : '',

        BI_TotalScore: document.getElementById('soapBiTotalScore').textContent

    };

function handleSoapNoteSubmit(onSuccessCallback) {
    showLoading('กำลังบันทึก SOAP Note...');
    const { soapData, biData } = getSoapFormData();

    google.script.run.withSuccessHandler(soapResponse => {
        if (soapResponse.status === 'success') {
            google.script.run.withSuccessHandler(biResponse => {
                if (biResponse.status === 'success') {
                    saveTmseFromParent(soapData.PatientID, soapData.VisitCount, soapData.VisitDate, () => {
                        showSuccessToast('บันทึก SOAP Note และ BI สำเร็จ!');
                        google.script.run.updateScheduleStatus(soapData.PatientID, soapData.VisitCount);
                        
                        // --- เพิ่มบรรทัดนี้เพื่อรีเฟรชข้อมูล Real-time ---
                        onSaveSuccess();
                        // ------------------------------------------
                        
                        if (typeof onSuccessCallback === 'function') onSuccessCallback();
                        else showHistory('SOAP');
                    });
                } else {
                    showError(biResponse);
                }
            })
            .withFailureHandler(showError)
            .saveBIAssessment(biData);
        } else {
            showError(soapResponse);
        }
    })
    .withFailureHandler(showError)
    .saveSOAPNote(soapData);
}

function editSoapNote(recordId) {
    showLoading('กำลังโหลดข้อมูล SOAP Note...');
    setupSoapForm(); // 1. สร้างโครงฟอร์มที่ว่างเปล่าก่อน

    // 2. ดึงข้อมูล SOAP Note
    google.script.run.withSuccessHandler(soapRes => {
        if (soapRes.status === 'success' && soapRes.record) {
            const soapRecord = soapRes.record;
            populateSoapForm(soapRecord); // 3. เติมข้อมูล SOAP
            loadCanvasImage('soapTherapistSignatureCanvas', soapRes.record.TherapistSignatureBase64);
            loadCanvasImage('soapPatientSignatureCanvas', soapRes.record.PatientSignatureBase64);

            // 4. ดึงข้อมูล BI ที่เกี่ยวข้อง (VisitCount เดียวกัน)
            google.script.run.withSuccessHandler(biRes => {
                if (biRes.status === 'success' && biRes.record) {
                    const biRecord = biRes.record;
                    const form = document.getElementById('soap-note-form');
                    
                    // 5. เติมข้อมูล BI ลงในฟอร์ม
                    form.querySelector('[name="BI_AssessmentID"]').value = biRecord.AssessmentID;
                    // (เติมคำถาม q1-q10)
                    for (let i = 1; i <= 10; i++) {
                        const q_val = biRecord[`q${i}`];
                        if (q_val !== undefined) {
                            const radio = form.querySelector(`#soap-bi-form-inner input[name="q${i}"][value="${q_val}"]`);
                            if (radio) radio.checked = true;
                        }
                    }
                    // (เติม Checkboxes)
                    form.querySelectorAll('#soap-bi-form-inner input[type="checkbox"]').forEach(cb => {
                        const cleanName = cb.name.replace('BI_', '');
                        if (biRecord[cleanName] === true) {
                            cb.checked = true;
                        }
                    });
                    
                    updateTotalBIScore('soapBiTotalScore', '#soap-bi-form-inner'); // อัปเดตคะแนนรวม
                }
                checkAndLoadTmse(soapRecord.PatientID, soapRecord.VisitCount);
                Swal.close();
            }).withFailureHandler(showError).getBIAssessmentByVisit(soapRecord.PatientID, soapRecord.VisitCount);
            
        } else {
            showError(soapRes);
        }
    }).withFailureHandler(showError).getSOAPNoteById(recordId);
}

function populateSoapForm(record) {
    const form = document.getElementById('soap-note-form');
    // 1. เติมข้อมูล Input ทั่วไป
    for (const key in record) {
        const el = form.querySelector(`[name="${key}"]`);
        if (el) {
             if (el.type === 'date' && record[key]) {
                // --- START: แก้ไขเรื่อง Timezone ---
                const date = new Date(record[key]);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                el.value = `${year}-${month}-${day}`;
                // --- END: สิ้นสุดการแก้ไข ---
             } else if (el.type === 'checkbox') {
                el.checked = record[key] === true || record[key] === 'true' || record[key] === 'TRUE' || record[key] === 1 || record[key] === '1' || record[key] === 'on';
             } else if (el.type === 'radio') {
                const radioEl = form.querySelector(`input[name="${key}"][value="${record[key]}"]`);
                if (radioEl) radioEl.checked = true;
             } else {
                el.value = record[key];
             }
        }
    }

    // จัดการเวลาให้ถูกต้อง
    const formatTime = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };
    form.querySelector('[name="StartTime"]').value = formatTime(record.StartTime);
    form.querySelector('[name="EndTime"]').value = formatTime(record.EndTime);
    applyServiceTypeSelection(form, record);

    // Restore GPS display
    if (record.GeoLocationTimestamp) {
        const soapGeoDisplay = document.getElementById('soapGeoLocationDisplay');
        if (soapGeoDisplay) soapGeoDisplay.value = record.GeoLocationTimestamp;
    }

    try {
        // 2. เติมข้อมูล Checkbox Groups
        populateCheckboxGroup('soap-diagnosis-container', 'Diagnosis', JSON.parse(record.DiagnosisJSON || '[]'));
        populateCheckboxGroup('soap-plan-container', 'Plan', record.Plan);

        // 3. เติมข้อมูล Objective และอื่นๆ (ส่วนที่เหลือของฟังก์ชัน)
        const objective = JSON.parse(record.ObjectiveJSON || '{}');
        if (objective.QualityMovement_Check) form.querySelector('[name="Objective_QualityMovement_Check"]').checked = true;
        if (objective.Other_Check) form.querySelector('[name="Objective_Other_Check"]').checked = true;
        if (objective.Other_Details) form.querySelector('[name="Objective_Other_Details"]').value = objective.Other_Details;
        if (objective.QualityMovement) {
            const qm = objective.QualityMovement;
            if(qm.UE) {
                form.querySelector('[name="QM_UE_Rt"]').value = qm.UE.Rt || '';
                form.querySelector('[name="QM_UE_Lt"]').value = qm.UE.Lt || '';
            }
            if(qm.LE) {
                form.querySelector('[name="QM_LE_Rt"]').value = qm.LE.Rt || '';
                form.querySelector('[name="QM_LE_Lt"]').value = qm.LE.Lt || '';
            }
        }

        const treatment = JSON.parse(record.TreatmentJSON || '{}');
        populateTreatmentForm(JSON.stringify(treatment)); 
        if(treatment.Ambulation) {
            const amb = treatment.Ambulation;
            const ambRadio = form.querySelector(`input[name="Ambulation"][value="${amb.Status}"]`);
            if(ambRadio) ambRadio.checked = true;
            if(amb.Status === 'PWB') form.querySelector(`[name="Ambulation_PWB_Percent"]`).value = amb.PWB_Percent || '';
        }

    } catch (e) { console.error("Error populating SOAP form:", e); }
}

function renderDailyScheduleList(dateString) {
    const listContainer = document.getElementById('daily-schedule-list');
    if (!listContainer) return;

    // 1. กรองนัดหมาย: เอาเฉพาะนัดวันนี้ และยังไม่ได้บันทึกเอกสาร (actualVisits)
    let pendingSchedules = allScheduleData.filter(s => {
        if (!s.ScheduledDate) return false;
        // รองรับทั้ง ISO String, ข้อความ d/m/yyyy ที่มี/ไม่มีเวลาต่อท้าย
        const sDate = normalizeScheduleDateToYMD(s.ScheduledDate);
        if (sDate !== dateString) return false;
        
        // ตัดนัดที่ Status ใน Sheet เป็น Completed ออกก่อน
        if (s.Status === 'Completed') return false;

        const p = allPatients.find(pat => String(pat.PatientID) === String(s.PatientID));
        // กรองออกถ้าตรวจพบว่ามีวันที่บันทึกงาน (actualVisits) ตรงกับวันนี้แล้ว
        if (p && p.actualVisits && p.actualVisits.includes(dateString)) return false; 
        
        return true;
    });

    // 2. เรียงลำดับตาม QueueIndex ที่บันทึกไว้ในระบบ
    pendingSchedules.sort((a, b) => (parseInt(a.QueueIndex) || 999) - (parseInt(b.QueueIndex) || 999));

    const totalToday = allScheduleData.filter(s => s.ScheduledDate && normalizeScheduleDateToYMD(s.ScheduledDate) === dateString).length;
    const completedCount = totalToday - pendingSchedules.length;
    const getScheduleZone = (schedule, patient) => schedule.ScheduleZone || schedule.Zone || patient?.Zone || 'ไม่ระบุโซน';

    // 3. จัดกลุ่มตามโซนพื้นที่ (Zones)
    const schedulesByZone = pendingSchedules.reduce((groups, s) => {
        const p = allPatients.find(pat => String(pat.PatientID) === String(s.PatientID));
        if (p) {
            const zone = getScheduleZone(s, p);
            if (!groups[zone]) groups[zone] = [];
            groups[zone].push({ schedule: s, patient: p });
        }
        return groups;
    }, {});

    // 4. สร้าง HTML ส่วนหัว
    let html = `

                    ${typeof formatThaiDate === 'function' ? formatThaiDate(dateString) : dateString}

                    นัดหมายทั้งหมด <span class="font-bold text-gray-800">${totalToday}</span> คน /

            </div>

        html += `<div class="text-center py-10 text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-200">เยี่ยมครบทุกคนแล้ว หรือไม่มีรายการนัดหมายในวันนี้</div>`;

    setTimeout(() => {
        const zoneLists = document.querySelectorAll('.zone-list');
        zoneLists.forEach(el => {
            new Sortable(el, {

                        item.setAttribute('data-zone', zone);
                        
                        updates.push({
                            patientId: item.getAttribute('data-patient-id'),
                            visitNumber: item.getAttribute('data-visit-number'),
                            queueIndex: index + 1,
                            zone
                        });

                            setTimeout(() => { statusDiv.innerHTML = ''; }, 3000);

                        .withFailureHandler(err => {

                        })
                        .saveScheduleOrder(updates);
                }
            });
        });
    }, 150);
}

// --- Updated Drag & Drop Logic (รองรับการลากภายใน Zone) ---

function allowDrop(ev) {
    ev.preventDefault();
}

function drag(ev) {
    draggedItem = ev.target.closest('.schedule-item');
    ev.dataTransfer.effectAllowed = "move";
    // เพิ่ม visual feedback
    setTimeout(() => draggedItem.classList.add('opacity-50', 'bg-gray-50'), 0);
}

function drop(ev) {
    ev.preventDefault();
    if (draggedItem) {
        draggedItem.classList.remove('opacity-50', 'bg-gray-50');
    }
    
    // หาโซนที่กำลังวาง (Drop Zone)
    const dropZoneList = ev.target.closest('.zone-list');
    
    // ถ้าไม่ได้วางในโซนลิสต์ หรือวางในโซนอื่น (Optional: ถ้าต้องการห้ามข้ามโซน)
    if (!dropZoneList) return;

    // หาเป้าหมายที่จะวาง (Target Item)
    const targetItem = ev.target.closest('.schedule-item');
    
    // ตรวจสอบว่า targetItem อยู่ใน dropZoneList เดียวกันหรือไม่ (เพื่อให้แน่ใจว่าลากในโซน)
    if (targetItem && dropZoneList.contains(targetItem) && draggedItem !== targetItem) {
        
        const allItems = [...dropZoneList.querySelectorAll('.schedule-item')];
        const dragIndex = allItems.indexOf(draggedItem);
        const targetIndex = allItems.indexOf(targetItem);

        if (dragIndex < targetIndex) {
            targetItem.after(draggedItem);
        } else {
            targetItem.before(draggedItem);
        }
        
        // อัปเดตเลขคิวใหม่ทั้งหมด (Global Update)
        updateListNumbers();
    } else if (!targetItem && dropZoneList) {
        // กรณีวางในพื้นที่ว่างของโซน (ต่อท้าย)
        dropZoneList.appendChild(draggedItem);
        updateListNumbers();
    }
}

function updateListNumbers() {
    let index = 1;
    // วนลูปหา .queue-number ทั้งหมดในหน้าแล้วรันเลขใหม่
    document.querySelectorAll('.queue-number').forEach(el => {
        el.textContent = index++;
    });
}

/**
 * Gathers the dates from the schedule modal and saves them.
 */
function handleSaveSchedules() {
    const patientId = document.getElementById('schedulePatientId').value;
    
    // เตรียม Array สำหรับส่งไป GAS (Sparse Array: index = visitNum-1)
    const dates = [];

    // 1. เก็บค่าจากการแก้ไขรายการเดิม (เฉพาะที่ยังไม่ Completed และมีการแก้ไข)
    document.querySelectorAll('.schedule-existing-input').forEach(input => {
        if (!input.disabled && input.value) {
            const vNum = parseInt(input.dataset.visit);
            dates[vNum - 1] = input.value;
        }
    });

    // 2. เก็บค่าจากการเพิ่มรายการใหม่
    const newDateInput = document.getElementById('new-schedule-date');
    const newVisitNumInput = document.getElementById('new-visit-number');
    
    if (newDateInput && newDateInput.value) {
        const newVNum = parseInt(newVisitNumInput.value);
        dates[newVNum - 1] = newDateInput.value;
    }

    // เช็คว่ามีการเปลี่ยนแปลงหรือไม่
    // (Array.keys() check is a bit tricky with sparse arrays, easiest is checking filtered length or just sending)
    const hasData = dates.some(d => d !== undefined);
    
    if (!hasData) {
        Swal.fire('ไม่ได้ระบุวันที่', 'กรุณาเลือกวันที่ต้องการนัดหมาย', 'warning');
        return;
    }

    showLoading('กำลังบันทึกนัดหมาย...');
    
    // ส่งไปที่ Google Apps Script
    google.script.run.withSuccessHandler(() => {
        showSuccessToast('บันทึกการนัดหมายเรียบร้อย');
        scheduleModal.hide();
        
        // Refresh ข้อมูลในตาราง
        google.script.run.withSuccessHandler(data => {
            // อัปเดตข้อมูล Global
            allPatients = data.patients || []; 
            // อัปเดตตาราง
            filterPatients(); 
        }).getInitialData(); // หรือใช้ฟังก์ชันย่อยถ้ามี เพื่อความเร็ว
        
    }).withFailureHandler(showError).saveSchedules({ patientId, dates });
}

function performLogout() {
    // 1. ล้างสถานะผู้ใช้
    loggedInUser = null;
    clearLoginSession();

    // 2. สลับหน้าจอ: ซ่อน App หลัก -> แสดงหน้า Login
    const mainApp = document.getElementById('main-app');
    const authContainer = document.getElementById('auth-container');

        mainApp.style.display = 'none';
    }

    if (authContainer) {
        // ล้าง style="display: none;" ออกเพื่อให้กลับไปใช้ CSS ตั้งต้น (ซึ่งน่าจะเป็น flex หรือ block)
        authContainer.style.removeProperty('display');
        
        // กันเหนียว: ถ้า CSS ตั้งต้นมองไม่เห็น ให้บังคับแสดงผล
        if (window.getComputedStyle(authContainer).display === 'none') {
            authContainer.style.display = 'flex'; 
        }
    }

    // 3. ล้างช่องกรอกข้อมูลในหน้า Login
    const userInput = document.getElementById('login-username');
    const passInput = document.getElementById('login-password');
    if (userInput) userInput.value = '';
    if (passInput) passInput.value = '';
    
    // 4. (เพิ่มเติม) ล้างข้อมูล Global อื่นๆ เพื่อความปลอดภัย (Optional)
    currentPatient = null;

            </div>
        </div>

}

function createTmseRadioOptions(name) {
    return `
        <div class="form-check form-check-inline m-0">
            <input class="form-check-input tmse-radio" type="radio" name="${name}" id="${name}_1" value="1" onchange="calculateTmseScore()">

        </div>
        <div class="form-check form-check-inline m-0">
            <input class="form-check-input tmse-radio" type="radio" name="${name}" id="${name}_0" value="0" onchange="calculateTmseScore()" checked>
            <label class="form-check-label text-sm text-red-600 font-medium" for="${name}_0">ผิด (0)</label>
        </div>
    `;

function calculateTmseScore() {
    let orientation = 0;
    const oKeys = ['q_day', 'q_date', 'q_month', 'q_time', 'q_place', 'q_job'];
    oKeys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked) orientation += parseInt(checked.value);
    });
    const subO = document.getElementById('sub_orientation');
    if (subO) subO.textContent = `${orientation}/6`;

    let registration = 0;
    const regKeys = ['q_reg_1', 'q_reg_2', 'q_reg_3'];
    regKeys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked) registration += parseInt(checked.value);
    });
    const subReg = document.getElementById('sub_registration');
    if (subReg) subReg.textContent = `${registration}/3`;

    let recall = 0;
    const rKeys = ['q_tree', 'q_car', 'q_hand'];
    rKeys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked) recall += parseInt(checked.value);
    });
    const subR = document.getElementById('sub_recall');
    if (subR) subR.textContent = `${recall}/3`;

    let attention = 0;
    const aKeys = ['q_fri', 'q_thu', 'q_wed', 'q_tue', 'q_mon'];
    aKeys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked) attention += parseInt(checked.value);
    });
    const subA = document.getElementById('sub_attention');
    if (subA) subA.textContent = `${attention}/5`;

    let calculation = 0;
    const cKeys = ['q_calc1', 'q_calc2', 'q_calc3'];
    cKeys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked) calculation += parseInt(checked.value);
    });
    const subC = document.getElementById('sub_calculation');
    if (subC) subC.textContent = `${calculation}/3`;

    let language = 0;
    const lKeys = ['q_watch', 'q_shirt', 'q_repeat', 'q_command1', 'q_command2', 'q_command3', 'q_read'];
    lKeys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked) language += parseInt(checked.value);
    });
    const drawChecked = document.querySelector(`input[name="q_draw"]:checked`);
    if (drawChecked) language += parseInt(drawChecked.value);
    
    let similarities = 0;
    const sim1 = document.querySelector(`input[name="q_similar1"]:checked`);
    const sim2 = document.querySelector(`input[name="q_similar2"]:checked`);
    if (sim1 && parseInt(sim1.value) === 1) similarities += 0.5;
    if (sim2 && parseInt(sim2.value) === 1) similarities += 0.5;
    language += similarities;
    
    const subL = document.getElementById('sub_language');
    if (subL) subL.textContent = `${language}/10`;

    const total = orientation + registration + recall + attention + calculation + language;
    const totalScoreDisplay = document.getElementById('tmse_total_score_display');
    if (totalScoreDisplay) totalScoreDisplay.textContent = total;

    const resultDisplay = document.getElementById('tmse_result_display');
    if (resultDisplay) {
        if (total < 23) {
            resultDisplay.textContent = 'ภาวะสมองเสื่อม';
            resultDisplay.className = 'text-2xl font-bold mt-1 text-red-400';
        } else if (total < 26) {
            resultDisplay.textContent = 'ผิดปกติ Cognitive impairment';
            resultDisplay.className = 'text-2xl font-bold mt-1 text-warning';
        } else {
            resultDisplay.textContent = 'ปกติ';
            resultDisplay.className = 'text-2xl font-bold mt-1 text-green-400';
        }
    }
}

function renderTmseHistory(records) {
    const columns = [
        { header: 'วันที่', key: r => formatThaiDate(r.VisitDate) },
        { header: 'คะแนน', key: r => `${r.total_score} / 30` },
        { header: 'แปลผล', key: r => r.result_status }
    ];
    const actions = r => `
        <button class="btn btn-outline-secondary btn-sm" onclick="editTMSEForm('${r.RecordID}')">แก้ไข</button>
        <button class="btn btn-outline-info btn-sm" onclick="printRecord('TMSE', '${r.RecordID}')">พิมพ์</button>
        <button class="btn btn-outline-danger btn-sm" onclick="confirmDelete('TMSE', '${r.RecordID}')">ลบ</button>
    `;
    const newButton = `<button class="btn btn-success" onclick="openNewTMSEForm()">ประเมิน TMSE ใหม่</button>`;
    renderHistoryTable(records, 'ประวัติการประเมิน TMSE', newButton, columns, actions);
}

function openNewTMSEForm() {
    const area = document.getElementById('history-container');
    if (area) area.style.display = 'none';
    const formContainer = document.getElementById('form-container-inner');
    formContainer.innerHTML = createTmseFormHtml(true);
    formContainer.style.display = 'block';

    document.getElementById('tmse_PatientID').value = currentPatient.PatientID;
    document.getElementById('tmse_VisitDate').value = toBangkokDateStr(new Date());

    google.script.run.withSuccessHandler(data => {
        if (data.status === 'success') {
            document.getElementById('tmse_VisitCount').value = data.visitCount;
        }
    }).getNextVisitCount(currentPatient.PatientID);

    calculateTmseScore();
}

function editTMSEForm(recordId) {
    showLoading('กำลังโหลดข้อมูล TMSE...');
    const area = document.getElementById('history-container');
    if (area) area.style.display = 'none';
    const formContainer = document.getElementById('form-container-inner');
    formContainer.innerHTML = createTmseFormHtml(true);
    formContainer.style.display = 'block';

    google.script.run.withSuccessHandler(response => {
        Swal.close();
        if (response.status === 'success' && response.record) {
            const data = response.record;
            document.getElementById('tmse_RecordID').value = data.RecordID;
            document.getElementById('tmse_PatientID').value = data.PatientID;
            document.getElementById('tmse_VisitDate').value = data.VisitDate ? toBangkokDateStr(data.VisitDate) : '';
            document.getElementById('tmse_VisitCount').value = data.VisitCount;

            const binaryFields = [
                'q_day', 'q_date', 'q_month', 'q_time', 'q_place', 'q_job',
                'q_reg_1', 'q_reg_2', 'q_reg_3',
                'q_tree', 'q_car', 'q_hand',
                'q_fri', 'q_thu', 'q_wed', 'q_tue', 'q_mon',
                'q_calc1', 'q_calc2', 'q_calc3',
                'q_watch', 'q_shirt', 'q_repeat', 'q_command1', 'q_command2', 'q_command3', 'q_read',
                'q_similar1', 'q_similar2'
            ];

            binaryFields.forEach(field => {
                const val = data[field];
                if (val !== undefined) {
                    const radio = document.querySelector(`input[name="${field}"][value="${val}"]`);
                    if (radio) radio.checked = true;
                }
            });

            if (data.q_draw !== undefined) {
                const radio = document.querySelector(`input[name="q_draw"][value="${data.q_draw}"]`);
                if (radio) radio.checked = true;
            }

            calculateTmseScore();
        } else {
            showError(response);
        }
    }).withFailureHandler(showError).getTMSERecordById(recordId);
}

function getTmseFormData() {
    const form = document.getElementById('tmse-form');
    if (!form) return {};
    const data = Object.fromEntries(new FormData(form).entries());
    const totalScoreDisplay = document.getElementById('tmse_total_score_display');
    const resultDisplay = document.getElementById('tmse_result_display');
    data.total_score = totalScoreDisplay ? totalScoreDisplay.textContent : '0';
    data.result_status = resultDisplay ? resultDisplay.textContent : 'ปกติ';
    return data;
}

function handleTmseSubmit(onSuccessCallback) {
    showLoading('กำลังบันทึก...');
    const data = getTmseFormData();
    google.script.run.withSuccessHandler(response => {
        if (response.status === 'success') {
            showSuccessToast(response.message);
            google.script.run.updateScheduleStatus(data.PatientID, data.VisitCount);
            if (typeof onSuccessCallback === 'function') onSuccessCallback();
            else showHistory('TMSE');
        } else {
            showError(response);
        }
    }).withFailureHandler(showError).saveTMSERecord(data);
}

function toggleTmseForm(checked) {
    const section = document.getElementById('tmse_form_section');
    if (section) {
        section.style.display = checked ? 'block' : 'none';
        if (checked && !section.innerHTML) {
            section.innerHTML = createTmseFormHtml(false);
            calculateTmseScore();
            // Set initial Date input to today
            const tmseDate = document.getElementById('tmse_VisitDate');
            if (tmseDate) {
                tmseDate.value = toBangkokDateStr(new Date());
            }
        }
    }
}

function saveTmseFromParent(patientId, visitCount, visitDate, callback) {
    const checkbox = document.getElementById('want_tmse');
    if (checkbox && checkbox.checked) {
        const tmseData = getTmseFormData();
        tmseData.PatientID = patientId;
        tmseData.VisitCount = visitCount;
        // If tmseDate was modified, keep it, otherwise use visitDate
        const tmseDateInput = document.getElementById('tmse_VisitDate');
        tmseData.VisitDate = (tmseDateInput && tmseDateInput.value) ? tmseDateInput.value : visitDate;
        google.script.run.withSuccessHandler(response => {
            if (response.status === 'success') {
                if (callback) callback();
            } else {
                showError(response);
            }
        }).withFailureHandler(showError).saveTMSERecord(tmseData);
    } else {
        if (callback) callback();
    }
}

function calculateMHQScore() {
    // --- Group 1: 2Q ---
    const q2_1 = document.querySelector('input[name="q2_1"]:checked');
    const q2_2 = document.querySelector('input[name="q2_2"]:checked');
    const has2qYes = (q2_1 && q2_1.value === 'YES') || (q2_2 && q2_2.value === 'YES');

    const el2qNo = document.getElementById('mhq_2q_no_icon');
    const el2qYes = document.getElementById('mhq_2q_yes_icon');
    if (el2qNo) el2qNo.textContent = has2qYes ? '☐' : '☑';
    if (el2qYes) el2qYes.textContent = has2qYes ? '☑' : '☐';

    const section9q = document.getElementById('mhq_9q_section');
    if (section9q) section9q.style.display = has2qYes ? 'block' : 'none';

    // --- Group 2: 9Q ---
    let score9q = 0;
    const q9Keys = ['q9_1', 'q9_2', 'q9_3', 'q9_4', 'q9_5', 'q9_6', 'q9_7', 'q9_8', 'q9_9'];
    q9Keys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked) score9q += parseInt(checked.value);
    });
    const total9qEl = document.getElementById('mhq_9q_total');
    if (total9qEl) total9qEl.textContent = `${score9q}/27`;
    const score9qDisplay = document.getElementById('mhq_9q_score_display');
    if (score9qDisplay) score9qDisplay.textContent = score9q;

    const setIcon = (id, cond) => { const el = document.getElementById(id); if (el) el.textContent = cond ? '☑' : '☐'; };
    setIcon('mhq_9q_lt7_icon', score9q < 7);
    setIcon('mhq_9q_7to12_icon', score9q >= 7 && score9q <= 12);
    setIcon('mhq_9q_13to18_icon', score9q >= 13 && score9q <= 18);
    setIcon('mhq_9q_gte19_icon', score9q >= 19);

    const showGroup3 = has2qYes && score9q >= 7;
    const section8q = document.getElementById('mhq_8q_section');
    if (section8q) section8q.style.display = showGroup3 ? 'block' : 'none';

    // --- Group 3: 8Q ---
    const q8Weights = { q8_1: 1, q8_2: 2, q8_3: 6, q8_3b: 8, q8_4: 8, q8_5: 9, q8_6: 4, q8_7: 10, q8_8: 4 };
    const q8Keys = ['q8_1', 'q8_2', 'q8_3', 'q8_4', 'q8_5', 'q8_6', 'q8_7', 'q8_8'];
    let score8q = 0;
    q8Keys.forEach(k => {
        const checked = document.querySelector(`input[name="${k}"]:checked`);
        if (checked && checked.value === '1') score8q += q8Weights[k];
    });
    const q3Checked = document.querySelector('input[name="q8_3"]:checked');
    const q3bChecked = document.querySelector('input[name="q8_3b"]:checked');
    if (q3Checked && q3Checked.value === '1' && q3bChecked && q3bChecked.value === '1') {
        score8q += q8Weights.q8_3b;
    }

    const total8qEl = document.getElementById('mhq_8q_total');
    if (total8qEl) total8qEl.textContent = score8q;
    const score8qDisplay = document.getElementById('mhq_8q_score_display');
    if (score8qDisplay) score8qDisplay.textContent = score8q;

    setIcon('mhq_8q_0_icon', score8q === 0);
    setIcon('mhq_8q_1to8_icon', score8q >= 1 && score8q <= 8);
    setIcon('mhq_8q_9to16_icon', score8q >= 9 && score8q <= 16);
    setIcon('mhq_8q_gte17_icon', score8q >= 17);

    const urgentAlert = document.getElementById('mhq_urgent_alert');
    if (urgentAlert) urgentAlert.classList.toggle('hidden', !(showGroup3 && score8q >= 17));

    // --- สรุปคะแนน/ผลรวมสำหรับตารางประวัติ ---
    let totalScore = 0;
    let resultStatus = '';
    if (!has2qYes) {
        totalScore = 0;
        resultStatus = '2Q : NO ทั้ง 2 ข้อ (ไม่มีความเสี่ยงซึมเศร้าเบื้องต้น)';
    } else {
        totalScore = score9q;
        if (score9q < 7) resultStatus = `9Q (${score9q} คะแนน) : ไม่มีอาการ/อาการน้อยมาก`;
        else if (score9q <= 12) resultStatus = `9Q (${score9q} คะแนน) : ซึมเศร้าระดับน้อย`;
        else if (score9q <= 18) resultStatus = `9Q (${score9q} คะแนน) : ซึมเศร้าระดับปานกลาง`;
        else resultStatus = `9Q (${score9q} คะแนน) : ซึมเศร้าระดับรุนแรง`;

        if (showGroup3) {
            totalScore = score8q;
            let level8q = '';
            if (score8q === 0) level8q = 'ไม่มีแนวโน้มฆ่าตัวตาย';
            else if (score8q <= 8) level8q = 'แนวโน้มฆ่าตัวตายระดับน้อย';
            else if (score8q <= 16) level8q = 'แนวโน้มฆ่าตัวตายระดับปานกลาง';
            else level8q = 'แนวโน้มฆ่าตัวตายระดับรุนแรง ⚠️ ส่งต่อด่วน';
            resultStatus += ` | 8Q (${score8q} คะแนน) : ${level8q}`;
        }
    }

    const totalDisplay = document.getElementById('mhq_total_score_display');
    if (totalDisplay) totalDisplay.textContent = totalScore;
    const resultDisplay = document.getElementById('mhq_result_display');
    if (resultDisplay) resultDisplay.textContent = resultStatus;
}

function getMHQFormData() {
    const form = document.getElementById('mhq-form');
    if (!form) return {};
    const data = Object.fromEntries(new FormData(form).entries());

    const totalScoreDisplay = document.getElementById('mhq_total_score_display');
    const resultDisplay = document.getElementById('mhq_result_display');
    data.total_score = totalScoreDisplay ? totalScoreDisplay.textContent : '0';
    data.result_status = resultDisplay ? resultDisplay.textContent : '';

    data.result_2q = (data.q2_1 === 'YES' || data.q2_2 === 'YES') ? 'YES' : 'NO';

    const score9qEl = document.getElementById('mhq_9q_score_display');
    const score9qNum = score9qEl ? (parseInt(score9qEl.textContent) || 0) : 0;
    data.score_9q = score9qNum;
    if (score9qNum < 7) data.result_9q = 'ไม่มีอาการ/น้อยมาก';
    else if (score9qNum <= 12) data.result_9q = 'ระดับน้อย';
    else if (score9qNum <= 18) data.result_9q = 'ระดับปานกลาง';
    else data.result_9q = 'ระดับรุนแรง';

    const score8qEl = document.getElementById('mhq_8q_score_display');
    const score8qNum = score8qEl ? (parseInt(score8qEl.textContent) || 0) : 0;
    data.score_8q = score8qNum;
    if (score8qNum === 0) data.result_8q = 'ไม่มีแนวโน้ม';
    else if (score8qNum <= 8) data.result_8q = 'ระดับน้อย';
    else if (score8qNum <= 16) data.result_8q = 'ระดับปานกลาง';
    else data.result_8q = 'ระดับรุนแรง';

    return data;
}

function editMHQForm(recordId) {
    showLoading('กำลังโหลดข้อมูลแบบประเมินสุขภาพจิต...');
    const area = document.getElementById('history-container');
    if (area) area.style.display = 'none';
    const formContainer = document.getElementById('form-container-inner');
    formContainer.innerHTML = createMHQFormHtml(true);
    formContainer.style.display = 'block';

    google.script.run.withSuccessHandler(response => {
        Swal.close();
        if (response.status === 'success' && response.record) {
            const data = response.record;
            document.getElementById('mhq_RecordID').value = data.RecordID;
            document.getElementById('mhq_PatientID').value = data.PatientID;
            document.getElementById('mhq_VisitDate').value = data.VisitDate ? toBangkokDateStr(data.VisitDate) : '';

            const fields2q = ['q2_1', 'q2_2'];
            fields2q.forEach(field => {
                const val = data[field];
                if (val !== undefined) {
                    const radio = document.querySelector(`input[name="${field}"][value="${val}"]`);
                    if (radio) radio.checked = true;
                }
            });

            const fields9q = ['q9_1', 'q9_2', 'q9_3', 'q9_4', 'q9_5', 'q9_6', 'q9_7', 'q9_8', 'q9_9'];
            fields9q.forEach(field => {
                const val = data[field];
                if (val !== undefined && val !== '') {
                    const radio = document.querySelector(`input[name="${field}"][value="${val}"]`);
                    if (radio) radio.checked = true;
                }
            });

            const fields8q = ['q8_1', 'q8_2', 'q8_3', 'q8_3b', 'q8_4', 'q8_5', 'q8_6', 'q8_7', 'q8_8'];
            fields8q.forEach(field => {
                const val = data[field];
                if (val !== undefined && val !== '') {
                    const radio = document.querySelector(`input[name="${field}"][value="${val}"]`);
                    if (radio) radio.checked = true;
                }
            });

            toggleMHQ8Q3Sub();
            calculateMHQScore();
        } else {
            showError(response);
        }
    }).withFailureHandler(showError).getMHQRecordById(recordId);
}

function handleMHQSubmit(onSuccessCallback) {
    showLoading('กำลังบันทึก...');
    const data = getMHQFormData();
    google.script.run.withSuccessHandler(response => {
        if (response.status === 'success') {
            showSuccessToast(response.message);
            if (typeof onSuccessCallback === 'function') onSuccessCallback();

        } else {
            showError(response);
        }
    }).withFailureHandler(showError).saveMHQRecord(data);
}

function createDysRow(name, label, withSymptoms, extraOnchange) {
    const extra = extraOnchange ? `${extraOnchange};` : '';
    const symptomsHtml = withSymptoms ? `
        <div id="dys_${name}_symptoms" class="hidden mt-2 ml-1 pl-3 border-l-4 border-orange-300 bg-orange-50 rounded p-2">
            <p class="text-xs font-semibold text-slate-600 mb-1">ระบุอาการที่เกิดขึ้น:</p>
            <div class="flex flex-wrap gap-3">
                ${createDysSymCheckbox(name.replace(/^q/, ''), 'cough', 'ไอ')}
                ${createDysSymCheckbox(name.replace(/^q/, ''), 'choke', 'สำลัก')}
                ${createDysSymCheckbox(name.replace(/^q/, ''), 'tachypnea', 'หอบเหนื่อยหายใจเร็ว')}
                ${createDysSymCheckbox(name.replace(/^q/, ''), 'wetvoice', 'มีเสียงน้ำในลำคอ หลังจิบน้ำ')}
            </div>
        </div>
    ` : '';
    return `
        <div id="dys_${name}_row" class="border-b pb-3 transition-opacity">
            <div class="flex flex-col md:flex-row md:items-center gap-2">
                <span class="text-slate-700 text-sm flex-grow">${label}</span>
                <div class="flex gap-3 flex-wrap md:justify-end flex-shrink-0">
                    <div class="form-check form-check-inline m-0">
                        <input class="form-check-input dys-radio" type="radio" name="${name}" id="${name}_yes" value="YES" onchange="${extra}calculateDysphagiaResult()">
                        <label class="form-check-label text-sm text-green-700 font-medium" for="${name}_yes">YES</label>
                    </div>
                    <div class="form-check form-check-inline m-0">
                        <input class="form-check-input dys-radio" type="radio" name="${name}" id="${name}_no" value="NO" onchange="${extra}calculateDysphagiaResult()">
                        <label class="form-check-label text-sm text-red-600 font-medium" for="${name}_no">NO</label>
                    </div>
                </div>
            </div>
            ${symptomsHtml}
        </div>
    `;
}

function createDysSymCheckbox(step, sym, label) {
    return `
        <div class="form-check m-0">
            <input class="form-check-input" type="checkbox" id="sym${step}_${sym}" name="sym${step}_${sym}" value="1" onchange="calculateDysphagiaResult()">
            <label class="form-check-label text-xs" for="sym${step}_${sym}">${label}</label>
        </div>
    `;
}

function handleOralCareChange() {
    const checked = document.querySelector('input[name="q2_2"]:checked');
    if (checked && checked.value === 'NO') {
        Swal.fire({
            icon: 'warning',
            title: 'ทำความสะอาดช่องปาก',
            text: 'กรุณาทำความสะอาดช่องปากให้ผู้ป่วยก่อนประเมินข้อถัดไป',
            confirmButtonText: 'รับทราบ',
            confirmButtonColor: '#0d9488',
            allowOutsideClick: false,
            allowEscapeKey: false
        });
    }
}

function calculateDysphagiaResult() {
    const getVal = (name) => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };
    const setIcon = (id, cond) => { const el = document.getElementById(id); if (el) el.textContent = cond ? '☑' : '☐'; };

    // --- Group 1 ---
    const q1_1 = getVal('q1_1'), q1_2 = getVal('q1_2'), q1_3 = getVal('q1_3');
    const g1HasNo = (q1_1 === 'NO' || q1_2 === 'NO' || q1_3 === 'NO');
    const g1AllYes = (q1_1 === 'YES' && q1_2 === 'YES' && q1_3 === 'YES');

    setIcon('dys_g1_fail_icon', g1HasNo);
    setIcon('dys_g1_pass_icon', g1AllYes);

    const g1FailBox = document.getElementById('dys_g1_fail_box');
    if (g1FailBox) g1FailBox.classList.toggle('hidden', !g1HasNo);

    const g2Section = document.getElementById('dys_g2_section');
    if (g2Section) g2Section.style.display = g1AllYes ? 'block' : 'none';

    let resultText = 'รอผลการประเมิน';
    if (g1HasNo) {
        resultText = 'Group 1: NO อย่างน้อย 1 ข้อ - งดน้ำและอาหารทางปาก, Feeding tube, Oromotor stimulation, Proper oral care, Consult PM&R';
    }

    if (g1AllYes) {
        // --- Group 2: ประเมินตามลำดับขั้นตอน ---
        const steps = [
            { name: 'q2_1', label: 'กลืนน้ำลายได้', withSymptoms: false, blockOnNo: true },
            { name: 'q2_2', label: 'ความสะอาดช่องปาก', withSymptoms: false, blockOnNo: false },
            { name: 'q2_3', label: 'จิบน้ำเปล่า 1 ช้อนชา ครั้งที่ 1', withSymptoms: true, blockOnNo: true },
            { name: 'q2_4', label: 'จิบน้ำเปล่า 1 ช้อนชา ครั้งที่ 2', withSymptoms: true, blockOnNo: true },
            { name: 'q2_5', label: 'จิบน้ำเปล่า 1 ช้อนชา ครั้งที่ 3', withSymptoms: true, blockOnNo: true },
            { name: 'q2_6', label: 'ดื่มน้ำเปล่าจากแก้ว 90 cc.', withSymptoms: true, blockOnNo: true },
            { name: 'q2_7', label: 'รับประทาน Regular diet', withSymptoms: true, blockOnNo: true, isLast: true }
        ];

        let stopped = false;
        let stopStep = null;

        steps.forEach(step => {
            const row = document.getElementById(`dys_${step.name}_row`);
            const inputs = row ? row.querySelectorAll('input') : [];

            if (stopped) {
                inputs.forEach(inp => inp.disabled = true);
                if (row) row.classList.add('opacity-40');
                return;
            }
            inputs.forEach(inp => inp.disabled = false);
            if (row) row.classList.remove('opacity-40');

            const val = getVal(step.name);
            const symBox = document.getElementById(`dys_${step.name}_symptoms`);

            if (val === 'NO') {
                if (symBox) symBox.classList.remove('hidden');
                if (step.blockOnNo) { stopped = true; stopStep = step; }
            } else {
                if (symBox) symBox.classList.add('hidden');
                if (val === null) stopped = true; // ยังไม่ตอบ ให้รอก่อนประเมินข้อถัดไป
            }
        });

        if (stopStep) {
            if (stopStep.name === 'q2_1') {
                resultText = 'ข้อ 1 กลืนน้ำลายไม่ได้ - งดน้ำและอาหารทางปาก, Feeding tube';
            } else if (stopStep.name === 'q2_7') {
                resultText = 'ข้อ 7 พบอาการผิดปกติขณะรับประทาน Regular diet - ปรับอาหาร (Diet modification: โจ๊กข้นปั่น/ข้าวต้มบดละเอียด), Compensation technique, Consult PM&R';
            } else {
                resultText = `หยุดที่ข้อ ${stopStep.name.replace('q2_', '')} (${stopStep.label}) พบอาการผิดปกติ - งดน้ำและอาหารทางปาก, Feeding tube, Oromotor stimulation, Proper oral care, Consult PM&R`;
            }
        } else {
            const allAnswered = steps.every(s => getVal(s.name) !== null);
            if (allAnswered && getVal('q2_7') === 'YES') {
                resultText = 'ผ่านการประเมินครบทุกขั้นตอน - รับประทาน Regular diet';
            } else if (!allAnswered) {
                resultText = 'กำลังประเมิน Group 2 (ยังตอบไม่ครบทุกข้อ)';
            }
        }

        const g2ResultText = document.getElementById('dys_g2_result_text');
        if (g2ResultText) g2ResultText.textContent = resultText;
    }

    const resultDisplay = document.getElementById('dys_result_display');
    if (resultDisplay) resultDisplay.textContent = resultText;
}

function getDysphagiaFormData() {
    const form = document.getElementById('dysphagia-form');
    if (!form) return {};
    const data = Object.fromEntries(new FormData(form).entries());

    const resultDisplay = document.getElementById('dys_result_display');
    data.result_status = resultDisplay ? resultDisplay.textContent : '';
    data.total_score = data.result_status ? data.result_status.split(' - ')[0] : '-';
    data.result_group1 = (data.q1_1 === 'NO' || data.q1_2 === 'NO' || data.q1_3 === 'NO')
        ? 'FAIL'
        : ((data.q1_1 === 'YES' && data.q1_2 === 'YES' && data.q1_3 === 'YES') ? 'PASS' : '');

    return data;
}

function openNewDysphagiaForm() {
    const area = document.getElementById('history-container');
    if (area) area.style.display = 'none';
    const formContainer = document.getElementById('form-container-inner');
    formContainer.innerHTML = createDysphagiaFormHtml(true);
    formContainer.style.display = 'block';

    document.getElementById('dys_PatientID').value = currentPatient.PatientID;
    document.getElementById('dys_VisitDate').value = toBangkokDateStr(new Date());

    calculateDysphagiaResult();
}

function editDysphagiaForm(recordId) {
    showLoading('กำลังโหลดข้อมูลแบบประเมินการกลืน...');
    const area = document.getElementById('history-container');
    if (area) area.style.display = 'none';
    const formContainer = document.getElementById('form-container-inner');
    formContainer.innerHTML = createDysphagiaFormHtml(true);
    formContainer.style.display = 'block';

    google.script.run.withSuccessHandler(response => {
        Swal.close();
        if (response.status === 'success' && response.record) {
            const data = response.record;
            document.getElementById('dys_RecordID').value = data.RecordID;
            document.getElementById('dys_PatientID').value = data.PatientID;
            document.getElementById('dys_VisitDate').value = data.VisitDate ? toBangkokDateStr(data.VisitDate) : '';

            const radioFields = ['q1_1', 'q1_2', 'q1_3', 'q2_1', 'q2_2', 'q2_3', 'q2_4', 'q2_5', 'q2_6', 'q2_7'];
            radioFields.forEach(field => {
                const val = data[field];
                if (val) {
                    const radio = document.querySelector(`input[name="${field}"][value="${val}"]`);
                    if (radio) radio.checked = true;
                }
            });

            const symSteps = ['2_3', '2_4', '2_5', '2_6', '2_7'];
            symSteps.forEach(step => {
                ['cough', 'choke', 'tachypnea', 'wetvoice'].forEach(sym => {
                    const field = `sym${step}_${sym}`;
                    if (Number(data[field]) === 1) {
                        const cb = document.getElementById(field);
                        if (cb) cb.checked = true;
                    }
                });
            });

            calculateDysphagiaResult();
        } else {
            showError(response);
        }
    }).withFailureHandler(showError).getDysphagiaRecordById(recordId);
}

function handleDysphagiaSubmit(onSuccessCallback) {
    showLoading('กำลังบันทึก...');
    const data = getDysphagiaFormData();
    google.script.run.withSuccessHandler(response => {
        if (response.status === 'success') {
            showSuccessToast(response.message);
            if (typeof onSuccessCallback === 'function') onSuccessCallback();
            else showHistory('Dysphagia');
        } else {
            showError(response);
        }
    }).withFailureHandler(showError).saveDysphagiaRecord(data);
}

function renderDysphagiaHistory(records) {
    const columns = [
        { header: 'วันที่', key: r => formatThaiDate(r.VisitDate) },
        { header: 'ผลการประเมิน', key: r => r.result_status }
    ];

        <button class="btn btn-outline-secondary btn-sm" onclick="editDysphagiaForm('${r.RecordID}')">แก้ไข</button>

        <button class="btn btn-outline-danger btn-sm" onclick="confirmDelete('Dysphagia', '${r.RecordID}')">ลบ</button>
    `;

    renderHistoryTable(records, 'ประวัติการประเมินการกลืน (Dysphagia)', newButton, columns, actions);
}

function checkAndLoadTmse(patientId, visitCount) {
    google.script.run.withSuccessHandler(response => {
        if (response.status === 'success' && response.records && response.records.length > 0) {
            const matched = response.records.find(r => Number(r.VisitCount) === Number(visitCount));
            if (matched) {
                const wantTmseCb = document.getElementById('want_tmse');
                if (wantTmseCb) {
                    wantTmseCb.checked = true;
                    toggleTmseForm(true);
                    
                    setTimeout(() => {
                        const recordIdInput = document.getElementById('tmse_RecordID');
                        if (recordIdInput) recordIdInput.value = matched.RecordID;
                        
                        const tmseDateInput = document.getElementById('tmse_VisitDate');
                        if (tmseDateInput) tmseDateInput.value = matched.VisitDate ? toBangkokDateStr(matched.VisitDate) : '';

                        const binaryFields = [
                            'q_day', 'q_date', 'q_month', 'q_time', 'q_place', 'q_job',
                            'q_tree', 'q_car', 'q_hand',
                            'q_fri', 'q_thu', 'q_wed', 'q_tue', 'q_mon',
                            'q_calc1', 'q_calc2', 'q_calc3',
                            'q_watch', 'q_shirt', 'q_repeat', 'q_command1', 'q_command2', 'q_command3', 'q_read',
                            'q_similar1', 'q_similar2'
                        ];

                        binaryFields.forEach(field => {
                            const val = matched[field];
                            if (val !== undefined) {
                                const radio = document.querySelector(`input[name="${field}"][value="${val}"]`);
                                if (radio) radio.checked = true;
                            }
                        });

                        if (matched.q_draw !== undefined) {
                            const radio = document.querySelector(`input[name="q_draw"][value="${matched.q_draw}"]`);
                            if (radio) radio.checked = true;
                        }

                        calculateTmseScore();
                    }, 200);
                }
            }
        }
    }).getTMSERecordsByPatientId(patientId);
}
